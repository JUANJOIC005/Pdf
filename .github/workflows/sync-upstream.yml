name: Sync upstream PdfCraft

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official PdfCraft tag (for example v0.18.2)
        required: true
        type: string
      fork_version:
        description: Version for the Pdf fork (for example 0.18.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Merge official release and preserve fork customizations
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          FORK_VERSION: ${{ inputs.fork_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync/upstream-${UPSTREAM_TAG#v}"
          git remote add upstream https://github.com/storytold/pdfcraft.git
          git fetch upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/upstream-${UPSTREAM_TAG}"
          git switch -C "$branch" origin/main
          if ! git merge --no-ff -X ours "refs/tags/upstream-${UPSTREAM_TAG}" -m "Merge PdfCraft ${UPSTREAM_TAG}"; then
            while IFS= read -r path; do
              git checkout --ours -- "$path" 2>/dev/null || git rm -f -- "$path"
              git add -- "$path" 2>/dev/null || true
            done < <(git diff --name-only --diff-filter=U)
            git commit -m "Merge PdfCraft ${UPSTREAM_TAG} preserving Pdf customizations"
          fi
          git rm -r --ignore-unmatch .github/workflows
          git checkout origin/main -- .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          # The official root manifests know every newly added crate. Restore them, then add
          # this fork's AI crate and repository identity.
          git checkout "refs/tags/upstream-${UPSTREAM_TAG}" -- Cargo.toml Cargo.lock
          sed -i 's|repository = "https://github.com/storytold/pdfcraft"|repository = "https://github.com/JUANJOIC005/Pdf"|' Cargo.toml
          sed -i -E '0,/^version = "[0-9]+\.[0-9]+\.[0-9]+"/s//version = "'"${FORK_VERSION}"'"/' Cargo.toml
          sed -i '/^# pdf$/i pdfcraft-ai = { path = "crates/ai", version = "'"${FORK_VERSION}"'" }\n' Cargo.toml
          cargo metadata --format-version 1 >/dev/null
          git add Cargo.toml Cargo.lock
          git commit -m "Prepare Pdf ${FORK_VERSION}"
          git push --force-with-lease origin "HEAD:$branch"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check Pdf
        run: cargo check --locked -p pdfcraft-ui-egui -p pdfcraft -p pdfcraft-ai
      - name: Validate architecture
        run: cargo xtask layers
